# Shared CTGTRec model configuration.
# Dataset-specific paper settings are loaded from configs/final/ctgtrec/.

embedding_size: 64
feat_embed_dim: 64
weight_size: [64, 64]

lambda_coeff: 0.9
cf_model: lightgcn
reg_weight: 0.0

n_mm_layers: 1
n_ui_layers: 1
knn_k: 10

mm_image_weight: 0.1
dropout: 0.0
degree_ratio: 0.0

ct_adj_dir: continuous_time_adj
ct_raw_adj_file: ct_raw_adj_user_tau0p3.npz
ct_time_adj_file: ct_adj_user_tau0p3.npz

g3_score_mode: boost
g3_score_lambda: 1.10
g3_late_ratio: 0.25
g3_trend_norm: zscore_clip
g3_strict_inter_file: true
g3_inter_file: ~

hyper_parameters: []
