# CT_FREEDOM_G3_SCORE_FINAL
# Final fixed G3-SCORE model for main-table verification.
#
# Current strongest setting:
#   score = s_CT + 1.10 * zscore_clip(trend)
#
# Use this as the new development baseline after G3 tuning.

g3_score_lambda: 1.10
g3_late_ratio: 0.25

embedding_size: 64
feat_embed_dim: 64
weight_size: [64, 64]

lambda_coeff: 0.9
cf_model: lightgcn
reg_weight: 0.0

n_mm_layers: 1
n_ui_layers: 1
knn_k: 10

mm_image_weight: 0.1
dropout: 0.0
degree_ratio: 0.0


ct_adj_dir: continuous_time_adj
ct_time_adj_file: ct_adj_user_tau0p3.npz

g3_score_mode: boost
g3_trend_norm: zscore_clip

g3_disable_dropout: True
g3_strict_inter_file: True
g3_inter_file: ~


hyper_parameters: []
