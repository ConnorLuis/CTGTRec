# MISSRec
# Hyperparameter-search version for MMRec-compatible MISSRec.
#
# Placement:
#   src/configs/model/MISSRec.yaml
#
# Run:
#   python main.py -m MISSRec -d baby
#   python main.py -m MISSRec -d sports
#   python main.py -m MISSRec -d clothing
#   python main.py -m MISSRec -d microlens
#
# Search size:
#   1 seed × 3 num_interest × 2 dropout × 2 temperature × 2 gamma × 2 item_fusion
#   = 48 configs / dataset.
#
# After choosing the best config, fix all hyperparameters and rerun with:
#   seed: [999, 2024, 3407]

model: MISSRec

# The official MISSRec config uses hidden_size=300.
# Use 64 first for fair runtime and comparable capacity with your other baselines.
missrec_hidden_size: 64
missrec_max_seq_length: 50
missrec_num_interest: [4]

# Transformer encoder-decoder
missrec_n_layers: 2
missrec_n_heads: 4
missrec_inner_size: 256
missrec_hidden_dropout_prob: [0.5]
missrec_attn_dropout_prob: [0.2]
missrec_hidden_act: gelu
missrec_layer_norm_eps: 1e-12
missrec_initializer_range: 0.02

# Contrastive / interest regularization scale
missrec_temperature: [0.07]
missrec_gamma: [0.0001]

# Modality and fusion
missrec_id_type: id
missrec_seq_mm_fusion: add
missrec_item_mm_fusion: [static]

# Training
train_batch_size: 1024
eval_batch_size: 1024
learning_rate: 0.001
reg_weight: 0.0

missrec_strict_inter_file: True

hyper_parameters: [
  "missrec_num_interest",
  "missrec_hidden_dropout_prob",
  "missrec_attn_dropout_prob",
  "missrec_temperature",
  "missrec_gamma",
  "missrec_item_mm_fusion"
]
