# M3Rec
# Hyperparameter-search version for MMRec-compatible M3Rec.
#
# Placement:
#   src/configs/model/M3Rec.yaml
#
# Run:
#   python main.py -m M3Rec -d baby
#   python main.py -m M3Rec -d sports
#   python main.py -m M3Rec -d clothing
#   python main.py -m M3Rec -d microlens
#
# Search size:
#   1 seed × 2 layers × 2 dropout × 2 d_state × 2 expand × 2 freeze_mm = 32 configs / dataset.
#
# After choosing the best config, fix all hyperparameters and rerun with:
#   seed: [999, 2024, 3407]

model: M3Rec

# M3Rec core
m3rec_hidden_size: 64
m3rec_max_seq_length: 50
m3rec_num_layers: [1]
m3rec_dropout_prob: [0.5]
m3rec_loss_type: BPR

# Mamba hyperparameters
m3rec_d_state: [16]
m3rec_d_conv: 4
m3rec_expand: [2]
m3rec_initializer_range: 0.02

# Official code freezes image/text sequence branches with no_grad.
# Searching this is useful because your datasets have very short sequences.
m3rec_freeze_mm_sequence: [True]

# Training
train_batch_size: 1024
eval_batch_size: 1024
learning_rate: 0.001
reg_weight: 0.0

# Sequence construction from train-only .inter
m3rec_strict_inter_file: True


hyper_parameters: [
  "m3rec_num_layers",
  "m3rec_dropout_prob",
  "m3rec_d_state",
  "m3rec_expand",
  "m3rec_freeze_mm_sequence"
]
